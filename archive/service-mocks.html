<!-- ══════════════════════════════════════════════════════════════════════
     ARCHIVED — the animated vignettes that used to sit in the right half of
     each expanded service row, replaced on 2026-09-04 by photographs.

     Nothing here is built or served: `archive/` is outside everything
     build.js copies. It is kept verbatim so the animations can come back.

     To restore one:
       1. paste its markup back as the second child of that row's
          <div class="svc-body-in">, in place of <!--cms:svc-shot:N-->
       2. paste the <style> block below back into the helmet stylesheet,
          just above the STORY section
       3. drop the .svc-shot rules, or leave them: a service with an empty
          image field renders no photograph at all

     `hl-float` is NOT in here — the hero graphic still uses it.
     ══════════════════════════════════════════════════════════════════════ -->

<style>
/* the little product vignettes inside each service row */
.mock{position:relative;height:200px;border-radius:var(--r);overflow:hidden;background:var(--bg);
  border:1px solid var(--line);box-shadow:var(--sh-2)}
.mock-in{position:absolute;inset:0;background:linear-gradient(180deg,var(--bg-soft),var(--surface))}
.card{position:absolute;background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);
  box-shadow:var(--sh-1)}
@keyframes hl-post{0%{transform:translateY(12px) scale(.97);opacity:0}
  10%,44%{transform:none;opacity:1}54%,100%{transform:translateY(-12px) scale(.97);opacity:0}}
/* engagement sparkline: thin tonal bars, not a wall of accent */
.spark{display:flex;align-items:flex-end;gap:5px}
.spark span{flex:1;height:100%;border-radius:3px 3px 1px 1px;transform-origin:bottom;
  background:linear-gradient(180deg,var(--aqua),color-mix(in srgb,var(--teal) 55%,var(--aqua)));
  opacity:.85;animation:hl-bar 3.2s var(--ease-out) infinite;animation-delay:var(--d)}
@keyframes hl-bar{0%,100%{transform:scaleY(.22)}50%{transform:scaleY(1)}}
@keyframes hl-skeleton{0%,100%{opacity:.4}50%{opacity:.95}}
@keyframes hl-dash{to{stroke-dashoffset:-28}}
@keyframes hl-travel{0%{offset-distance:0%;opacity:0}10%,90%{opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes hl-pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.3);opacity:.2}}
@keyframes hl-chip{0%,20%{background:var(--aqua-100);color:var(--teal-800)}
  32%,58%{background:var(--aqua);color:var(--deep)}72%,100%{background:var(--aqua-100);color:var(--teal-800)}}
</style>
